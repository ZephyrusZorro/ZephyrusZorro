<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 316" role="img"><title>Adaptive Traffic Signals – illustrated queue release</title><defs><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#5a6080"/></pattern><clipPath id="frame"><rect x="510" y="0" width="490" height="316"/></clipPath></defs><style>.flow{animation:release 8s linear infinite}.lamp{animation:go 8s step-end infinite}.scan{animation:read 8s ease-in-out infinite}@keyframes release{0%{transform:translateX(-42px);opacity:0}12%{opacity:1}28%,55%{transform:translateX(0);opacity:1}91%,100%{transform:translateX(350px);opacity:0}}@keyframes go{0%,98%{fill:#ed9aca}55%{fill:#a1f0db}}@keyframes read{0%,54%,100%{opacity:.9}65%,90%{opacity:.18}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="316" rx="12" fill="#191a31"/><rect x="510" width="490" height="316" fill="url(#grid)"/><g clip-path="url(#frame)"><g transform="rotate(-14 765 155)"><path d="M444 157H1060M765 -95V385" fill="none" stroke="#525779" stroke-width="86"/><path d="M444 157H1060M765 -95V385" fill="none" stroke="#292c46" stroke-width="82"/><path d="M444 157h279m86 0h251M765 -95v210m0 85v185" fill="none" stroke="#7982a0" stroke-width="2" stroke-dasharray="13 11"/><path d="M711 161v34m108-74v33" stroke="#d0cbe7" stroke-width="4"/><g class="flow"><g transform="translate(669 171)"><rect width="28" height="14" rx="4" fill="#bbaeff"/><rect x="17" y="2" width="6" height="10" rx="1" fill="#343854"/><path d="M2 3v8m24-8v8" stroke="#eef5ff" stroke-width="1"/></g><g transform="translate(626 171)"><rect width="28" height="14" rx="4" fill="#c8eaff"/><rect x="17" y="2" width="6" height="10" rx="1" fill="#343854"/><path d="M2 3v8m24-8v8" stroke="#eef5ff" stroke-width="1"/></g><g transform="translate(583 171)"><rect width="28" height="14" rx="4" fill="#a2b0dc"/><rect x="17" y="2" width="6" height="10" rx="1" fill="#343854"/><path d="M2 3v8m24-8v8" stro