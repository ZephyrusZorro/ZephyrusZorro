name: Update profile telemetry & art

# Refreshes the animated contribution graph and telemetry stats SVGs daily from real GitHub data.
# Runs daily on schedule, on main pushes, and on-demand via workflow_dispatch.

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scrape live contribution data
        env:
          GH_PROFILE_USER: ZephyrusZorro
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render animated telemetry stats SVG
        run: python scripts/render_stats_svg.py

      - name: Render Neofetch systems card SVG
        run: python scripts/make_neofetch_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(art): refresh live telemetry & contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg neofetch-card.svg"
